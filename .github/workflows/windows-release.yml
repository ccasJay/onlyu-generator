name: Windows Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify release configuration
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
                    if [ -z "${!name}" ]; then
                      echo "::error::缺少发布所需 secret：$name"
                      exit 1
                    fi
                  done

            - name: Verify version and tag
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
                    echo "::error::标签 ${GITHUB_REF_NAME} 与版本 v${VERSION} 不一致"
                    exit 1
                  fi
                  npm run version:check

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Build and publish release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: v__VERSION__
                  releaseName: 'OnlyU Generator v__VERSION__'
                  releaseBody: |
                      OnlyU Generator v__VERSION__

                      0.1.0 用户需要手动安装一次 0.2.0；自动更新从 0.2.0 起生效。
                  releaseDraft: false
                  prerelease: false
                  args: --bundles nsis
                  includeUpdaterJson: true
                  updaterJsonPreferNsis: true
