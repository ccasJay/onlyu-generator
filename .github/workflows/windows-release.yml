name: Windows Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify release configuration
              shell: bash
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
              run: |
                  set -euo pipefail
                  for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD RELEASES_TOKEN; do
                    if [ -z "${!name}" ]; then
                      echo "::error::缺少发布所需 secret：$name"
                      exit 1
                    fi
                  done

            - name: Verify version and tag
              shell: bash
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
                    echo "::error::标签 ${GITHUB_REF_NAME} 与版本 v${VERSION} 不一致"
                    exit 1
                  fi
                  npm run version:check

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Build and publish private release
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: v__VERSION__
                  releaseName: 'OnlyU Generator v__VERSION__'
                  releaseBody: |
                      OnlyU Generator v__VERSION__

                      0.1.0 用户需要手动安装一次 0.2.0；自动更新从 0.2.0 起生效。
                  releaseDraft: false
                  prerelease: false
                  args: --bundles nsis
                  includeUpdaterJson: true
                  updaterJsonPreferNsis: true

            - name: Mirror release to public repository
              shell: bash
              env:
                  SOURCE_REPO: ${{ github.repository }}
                  SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_REPO: ${{ vars.RELEASES_REPOSITORY || 'ccasJay/onlyu-generator-releases' }}
                  TARGET_TOKEN: ${{ secrets.RELEASES_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  mkdir -p release-assets
                  GH_TOKEN="${SOURCE_TOKEN}" gh release download "${TAG}" --repo "${SOURCE_REPO}" --dir release-assets --clobber
                  node scripts/rewrite-latest-json.mjs release-assets/latest.json "${SOURCE_REPO}" "${TARGET_REPO}"

                  cat > release-notes.md <<'EOF'
                  OnlyU Generator 自动更新版本。

                  0.1.0 用户需要手动安装一次 0.2.0；自动更新从 0.2.0 起生效。
                  EOF

                  if GH_TOKEN="${TARGET_TOKEN}" gh release view "${TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
                    GH_TOKEN="${TARGET_TOKEN}" gh release upload "${TAG}" release-assets/* --repo "${TARGET_REPO}" --clobber
                  else
                    GH_TOKEN="${TARGET_TOKEN}" gh release create "${TAG}" release-assets/* --repo "${TARGET_REPO}" --title "OnlyU Generator ${TAG}" --notes-file release-notes.md --latest
                  fi
